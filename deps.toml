version = "0.1.0"
title = "Gradient Forest Variance Partitioning on Ranger Models"
description = "Implements the gradient forest algorithm as a post-hoc analysis suite for ranger random forest models. Computes turnover curves, importance rankings, and diagnostic summaries."
